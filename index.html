
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:#000;color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
overflow-y:auto;
padding:30px 0;
}
canvas{position:fixed;inset:0;z-index:-2}
#terminal,#content{width:min(900px,95%);padding:25px}
#terminal pre{color:#00ff88;white-space:pre-wrap;font-size:18px}
#content{
display:none;
text-align:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(14px);
border-radius:22px;
padding:30px;
max-height:90vh;
overflow-y:auto;
box-shadow:0 0 25px hotpink;
}
h1{color:#ff5d8f;font-size:clamp(34px,6vw,56px);margin-bottom:15px}
.slider{width:min(320px,85vw);height:min(320px,85vw);margin:20px auto;border:4px solid hotpink;border-radius:20px;overflow:hidden}
.slider img{width:100%;height:100%;object-fit:cover}
p{font-size:22px;line-height:1.7;margin-top:20px;white-space:pre-wrap}
button{margin-top:24px;padding:14px 28px;border:none;border-radius:30px;background:#ff4d6d;color:#fff;font-size:18px;cursor:pointer}
#love{display:none;margin-top:30px;font-size:24px;line-height:1.8;color:#ffd2e7}
.music{position:fixed;top:20px;right:20px;width:52px;height:52px;border-radius:50%}
.hearts{position:fixed;animation:float linear infinite}
@keyframes float{from{transform:translateY(110vh)}to{transform:translateY(-120vh)}}
.conf{position:fixed;top:-20px;transition:all 4s linear}
</style>
</head>
<body>

<audio id="bgMusic" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<canvas id="matrix"></canvas>

<div id="terminal"><pre id="text"></pre></div>

<div id="content">
<h1>Happy Girlfriend Day ❤️</h1>

<div class="slider">
<img id="photo" src="photo1.jpg">
</div>

<p id="typing"></p>

<button onclick="showLove()">Click Here ❤️</button>

<div id="love">
❤️ <b>I Love You Rishika</b> ❤️
<br><br>
Thank you for making my life brighter every single day.
<br><br>
No matter how far we are,
you'll always have my heart.
<br><br>
Forever Yours,
<br>
❤️ <b>Omi</b> ❤️
</div>
</div>

<button class="music" onclick="toggleMusic()">🎵</button>

<script>
const lines=[
"Initializing Love System...",
"Loading...",
"████████████████ 100%",
"",
"Searching...",
"Girl Found ✔",
"Name : Rishika",
"Smile : Infinity",
"Cuteness : Unlimited",
"Love : Endless",
"",
"ACCESS GRANTED ❤️"
];
const text=document.getElementById("text");
let i=0;
function terminal(){
 if(i<lines.length){
   text.textContent+=lines[i++]+"\n";
   setTimeout(terminal,450);
 }else{
   setTimeout(()=>{
     document.getElementById("terminal").style.display="none";
     document.getElementById("content").style.display="block";
     type();
   },700);
 }
}
terminal();

const msg=`Dear Rishika ❤️,

Happy Girlfriend Day!

Thank you for coming into my life.
Every smile of yours is my favorite moment.
I don't need a perfect world because I already found my favorite person.

I love you endlessly. ❤️`;

let j=0;
function type(){
 const el=document.getElementById("typing");
 if(j<msg.length){
   el.textContent+=msg.charAt(j++);
   setTimeout(type,35);
 }
}

const imgs=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg","photo6.jpg"];
let p=0;
setInterval(()=>{
 const im=document.getElementById("photo");
 im.style.opacity=0;
 setTimeout(()=>{p=(p+1)%imgs.length;im.src=imgs[p];im.style.opacity=1;},350);
},3000);

const music=document.getElementById("bgMusic");
function toggleMusic(){music.paused?music.play():music.pause();}
function showLove(){
 document.getElementById("love").style.display="block";
 music.play().catch(()=>{});
 for(let i=0;i<80;i++){
  let d=document.createElement("div");
  d.className="conf";
  d.innerHTML=["❤️","💖","🌸","✨"][Math.floor(Math.random()*4)];
  d.style.left=Math.random()*100+"vw";
  d.style.fontSize=(18+Math.random()*20)+"px";
  document.body.appendChild(d);
  setTimeout(()=>{d.style.transform="translateY(120vh) rotate(720deg)";d.style.opacity=0;},50);
  setTimeout(()=>d.remove(),4000);
 }
}
for(let k=0;k<40;k++){
 let h=document.createElement("div");
 h.className="hearts";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(18+Math.random()*18)+"px";
 h.style.animationDuration=(4+Math.random()*4)+"s";
 document.body.appendChild(h);
}
const c=document.getElementById("matrix"),x=c.getContext("2d"),f=14;
let drops=[];
function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.floor(c.width/f)).fill(1);}
resize();onresize=resize;
setInterval(()=>{
 x.fillStyle="rgba(0,0,0,.05)";x.fillRect(0,0,c.width,c.height);
 x.fillStyle="#00ff66";x.font=f+"px monospace";
 for(let i=0;i<drops.length;i++){
  x.fillText(Math.random()>0.5?"1":"0",i*f,drops[i]*f);
  if(drops[i]*f>c.height&&Math.random()>.975)drops[i]=0;
  drops[i]++;
 }
},35);
</script>
</body>
</html>
